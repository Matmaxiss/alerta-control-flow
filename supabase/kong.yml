
_format_version: "2.1"

services:
  - name: auth-v1-open
    url: http://supabase-auth:9999/verify
    plugins:
      - name: cors
  - name: auth-v1-open-callback
    url: http://supabase-auth:9999/callback
    plugins:
      - name: cors
  - name: auth-v1-open-authorize
    url: http://supabase-auth:9999/authorize
    plugins:
      - name: cors

  - name: rest-v1
    url: http://supabase-rest:3000/
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Accept-Version
            - Content-Length
            - Content-MD5
            - Content-Type
            - Date
            - X-Auth-Token
            - Authorization
            - X-Client-Info
            - apikey
          exposed_headers:
            - "*"
          credentials: true
          max_age: 3600
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - anon
            - authenticated

  - name: realtime-v1
    url: http://supabase-realtime:4000/socket/
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Accept-Version
            - Content-Length
            - Content-MD5
            - Content-Type
            - Date
            - X-Auth-Token
            - Authorization
            - X-Client-Info
            - apikey
          exposed_headers:
            - "*"
          credentials: true
          max_age: 3600
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - anon
            - authenticated

routes:
  - name: auth-verify
    service: auth-v1-open
    methods:
      - GET
      - POST
    paths:
      - /auth/v1/verify

  - name: auth-callback
    service: auth-v1-open-callback
    methods:
      - GET
      - POST
    paths:
      - /auth/v1/callback

  - name: auth-authorize
    service: auth-v1-open-authorize
    methods:
      - GET
      - POST
    paths:
      - /auth/v1/authorize

  - name: rest-api
    service: rest-v1
    methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    paths:
      - /rest/v1/
    strip_path: true

  - name: realtime-api
    service: realtime-v1
    methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    paths:
      - /realtime/v1/
    strip_path: true

