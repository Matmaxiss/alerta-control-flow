
_format_version: "2.1"

services:
  - name: auth-v1-open
    url: http://supabase-auth:9999/verify
    plugins:
      - name: cors
  - name: auth-v1-open-callback
    url: http://supabase-auth:9999/callback
    plugins:
      - name: cors
  - name: auth-v1-open-authorize
    url: http://supabase-auth:9999/authorize
    plugins:
      - name: cors

  - name: rest-v1
    _comment: "PostgREST: /rest/v1/* -> http://supabase-rest:3000/*"
    url: http://supabase-rest:3000/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - anon
            - authenticated

  - name: realtime-v1
    _comment: "Realtime: /realtime/v1/* -> ws://supabase-realtime:4000/socket/*"
    url: http://supabase-realtime:4000/socket/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - anon
            - authenticated

routes:
  - service: auth-v1-open
    match:
      methods:
        - GET
        - POST
      paths:
        - ~/auth/v1/verify$
  - service: auth-v1-open-callback
    match:
      methods:
        - GET
        - POST
      paths:
        - ~/auth/v1/callback$
  - service: auth-v1-open-authorize
    match:
      methods:
        - GET
        - POST
      paths:
        - ~/auth/v1/authorize$

  - service: rest-v1
    match:
      paths:
        - ~/rest/v1/(.*)$
    plugins:
      - name: request-transformer
        config:
          strip_path: true

  - service: realtime-v1
    match:
      paths:
        - ~/realtime/v1/(.*)$
    plugins:
      - name: request-transformer
        config:
          strip_path: true

consumers:
